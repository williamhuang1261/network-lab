# Minimal Slurm 21.08 cluster configuration for network-lab's simulated
# GPU scheduling demo. There is no physical GPU on any node here -- see
# gres.conf in this directory and docs/slurm.md in the repo root for the
# explicit simulated-GPU disclosure (same honesty standard as docs/rdma.md).
ClusterName=network-lab
SlurmctldHost=slurmctld

AuthType=auth/munge
CredType=cred/munge
MpiDefault=none

# No cgroup delegation inside these containers (same constraint class as
# docs/rdma.md's Docker Desktop note) -- task/none and proctrack/linuxproc
# avoid needing cgroup v2 controllers the container runtime doesn't expose.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=1

SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SwitchType=switch/none

SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# GRES scheduling -- Gres=gpu below on the compute node is a declared,
# software-only resource count, not a probe of real hardware.
GresTypes=gpu
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmctld
AccountingStoragePort=6819
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/linux

# Compute node: 2 CPUs, 2 declared (simulated) GPUs.
NodeName=slurmd-compute NodeAddr=slurmd-compute CPUs=2 RealMemory=900 Gres=gpu:2 State=UNKNOWN
PartitionName=gpu Nodes=slurmd-compute Default=YES MaxTime=INFINITE State=UP
