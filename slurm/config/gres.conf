# SIMULATED GPUs. Slurm's gres/gpu plugin silently drops any GPU entry with
# no File= path ("file-less GPU"), so /dev/fakegpu0 and /dev/fakegpu1 exist
# only to satisfy that plugin check -- they are copies of /dev/null created
# by entrypoint-compute.sh at container start, not a real accelerator, not
# backed by any GPU driver, and not visible to nvidia-smi or CUDA. See
# docs/slurm.md for the full disclosure, matching docs/rdma.md's existing
# honesty standard for the RDMA loopback numbers.
NodeName=slurmd-compute Name=gpu File=/dev/fakegpu[0-1]
