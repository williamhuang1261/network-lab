# slurmdbd config for the network-lab simulated GPU cluster demo.
# StoragePass here is a fixed demo credential for a throwaway local
# MariaDB container with no exposed port beyond the compose/k8s-internal
# network -- not a production secret. See docs/slurm.md.
AuthType=auth/munge
DbdHost=slurmctld
DbdPort=6819
SlurmUser=slurm
DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/var/run/slurm/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=mariadb
StoragePort=3306
StorageUser=slurm
StoragePass=slurm-demo-password
StorageLoc=slurm_acct_db
