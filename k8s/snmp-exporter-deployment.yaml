apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: network-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
    spec:
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:latest
          ports:
            - containerPort: 9116
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 9116
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: network-lab
spec:
  selector:
    app: snmp-exporter
  ports:
    - port: 9116
      targetPort: 9116
