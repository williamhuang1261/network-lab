frr version 9.1
frr defaults traditional
hostname r3
log stdout
!
interface lo
 ip address 10.0.0.3/32
!
router bgp 65003
 no bgp ebgp-requires-policy
 neighbor 10.0.23.2 remote-as 65002
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 10.0.23.2 activate
 exit-address-family
!
line vty
!
